<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}交期確認工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% if user %}<meta name="csrf" content="{{ user.csrf }}">{% endif %}
</head>
<body>
{% if user %}
<header class="top"><div class="wrap">
  <a class="brand" href="/">交期確認工作台</a>
  <nav><a href="/#pending">待審核</a><a href="/#recent">最近信件</a><a href="/#inbox">收件資料夾</a></nav>
  <div class="who">
    <span>{{ user.full_name }}（{{ user.role_label }}）</span>
    <form method="post" action="/logout"><button class="link" type="submit">登出</button></form>
  </div>
</div></header>
{% endif %}
<main class="wrap">
  {% if msg %}<div class="flash {{ level }}">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
